services:
  lunaris-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunaris-server
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8443:8443"   # HTTPS web client (controllers, clipboard)
      # Built-in TURN relay (needs LUNARIS_TURN_PUBLIC_IP below)
      - "3478:3478/udp"
      - "49160-49260:49160-49260/udp"
    volumes:
      # Database, agent token and the initial admin password live here.
      - lunaris-data:/data
    environment:
      - SERVER_PORT=8090
      - RUST_LOG=info
      # Initial admin password (first start only). When unset a random one is
      # generated: see `docker logs lunaris-server` or /data/initial_admin_password.txt.
      # - LUNARIS_ADMIN_PASSWORD=change-me
      # Token agents use to register (generated on first start when unset):
      # - LUNARIS_TOKEN=your_secure_agent_token_here
      # This host's LAN or public address, for the built-in TURN relay that
      # connects clients and agents which can't reach each other directly.
      # Without it the relay stays off (the container's own address is
      # unreachable from outside).
      # - LUNARIS_TURN_PUBLIC_IP=192.168.1.10

volumes:
  lunaris-data:
    name: lunaris-server-data
