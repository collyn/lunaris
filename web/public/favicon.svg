<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Lunaris</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="244" cy="272" r="150" fill="#fff"/>
      <circle cx="330" cy="190" r="128" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" fill="#fff" mask="url(#crescent)"/>
  <!-- pointer resting in the crescent's bite: remote control -->
  <path d="M322 136 L322 262 L352 233 L373 281 L396 271 L375 224 L417 221 Z"
        fill="#fff" stroke-linejoin="round"/>
</svg>
