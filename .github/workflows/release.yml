name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/packaging/**'
      - 'server/**'
      - 'Dockerfile'
      - 'agent/**'
      - 'approval-channel/**'
      - 'approval-helper/**'
      - 'client-qml/**'
      - 'client-desktop/**'
      - 'updater/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-server-linux:
    name: Build Linux Server (static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # The server embeds web/dist, so build the web client first.
      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-04-17
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: server-musl

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-zigbuild

      # Fully static musl binaries: run on any Linux distro, x86_64 and ARM64.
      - name: Build and package
        run: |
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --locked -p server --target $arch-unknown-linux-musl
            dir=lunaris-server-linux-$arch
            mkdir -p $dir
            cp target/$arch-unknown-linux-musl/release/server $dir/lunaris-server
            cp LICENSE $dir/
            tar -czf $dir.tar.gz $dir
          done
          file lunaris-server-linux-*/lunaris-server

      # The same static binaries as lunaris-server_<ver>_{amd64,arm64}.deb:
      # system user, hardened systemd unit, enabled and started on install.
      - name: Build server .deb packages
        run: |
          bash scripts/packaging/linux/make-server-deb.sh lunaris-server-linux-x86_64/lunaris-server amd64 server-deb
          bash scripts/packaging/linux/make-server-deb.sh lunaris-server-linux-aarch64/lunaris-server arm64 server-deb
          for deb in server-deb/*.deb; do dpkg-deb --info "$deb"; dpkg-deb --contents "$deb"; done

      - name: Upload Server Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-linux
          path: lunaris-server-linux-*.tar.gz

      - name: Upload Server .deb Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-linux-deb
          path: server-deb/*.deb

  build-server-docker:
    name: Build Server Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          tags: lunaris-server:ci
          load: true
          cache-from: type=gha,scope=server-docker
          cache-to: type=gha,mode=max,scope=server-docker

      - name: Smoke test
        run: |
          docker run -d --name lunaris -p 8090:8090 lunaris-server:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/ | grep -q '<div id="root">'
          docker exec lunaris test -s /data/setup_code.txt
          curl -fsS http://127.0.0.1:8090/api/setup | grep -q '"needed":true'
          docker logs lunaris 2>&1 | tail -20

  build-linux-packages:
    name: Linux packages (${{ matrix.format }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # rpm (fedora:44) and arch are paused: the pipewire/libspa 0.8 crates
        # don't build with clang 21 (bindgen 0.69); needs the pipewire 0.9
        # upgrade in lunaris-media. The scripts support them already.
        include:
          - format: deb
            image: ubuntu:24.04
    steps:
      # actions/checkout needs git in the container to produce a real clone
      # (the Arch build uses `git archive`).
      - name: Install git
        run: |
          case "${{ matrix.format }}" in
            deb)  apt-get update && apt-get install -y git ca-certificates ;;
            rpm)  dnf -y install git ;;
            arch) pacman -Syu --noconfirm git ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache static FFmpeg
        if: matrix.format != 'arch'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /opt/lunaris-ffmpeg
          key: ffmpeg-static-${{ matrix.format }}-${{ hashFiles('scripts/packaging/build-ffmpeg-static.sh') }}

      # (No web client here: the agent and the client (the stream window)
      # embed none; the server packages are built by build-server-linux.)

      # Crates and the build of the dependencies: a change to lunaris alone
      # then rebuilds only what changed. Keyed like the AppImage cache.
      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target-packages
          key: packages-${{ matrix.format }}-${{ hashFiles('Cargo.lock', 'scripts/packaging/build-ffmpeg-static.sh') }}
          restore-keys: packages-${{ matrix.format }}-

      - name: Build packages
        env:
          CARGO_TARGET_DIR: target-packages
        run: bash scripts/packaging/linux/build-packages.sh ${{ matrix.format }} dist

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages-${{ matrix.format }}
          path: dist/*

  # The .deb is built on Ubuntu 24.04 and has to install and start on the later
  # releases too, where packages are named differently (libqt6gui6t64 there is
  # libqt6gui6 on Ubuntu 26.04 and Debian 13) and Qt is newer. Each release
  # installs the built packages in a bare container and starts both apps.
  test-linux-packages:
    name: Install .deb on ${{ matrix.image }}
    needs: [build-linux-packages, build-server-linux]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:26.04', 'debian:13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages-deb
          path: dist

      # The server package too (amd64 only: these runners are x86_64). In a
      # container without systemd its postinst still creates the user and
      # server.env; the smoke test then runs the binary in the foreground.
      - name: Download server package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-linux-deb
          path: server-deb

      - name: Add the server package
        run: cp server-deb/lunaris-server_*_amd64.deb dist/

      - name: Install and start
        run: bash scripts/packaging/linux/smoke-deb.sh dist

  # The agent and the client AppImages, built together in one Ubuntu 22.04
  # container (Qt 6.8 for the client, a trimmed static FFmpeg, see
  # Containerfile.appimage; the agent AppImage has no Qt):
  # runs on glibc >= 2.35, no distro FFmpeg or Qt is bundled. build-appimages.sh
  # prunes the bundles, runs a start-up check on each (smoke-appimage.sh, under
  # xvfb) and repeats it in a bare ubuntu:22.04 container.
  build-agent-appimage:
    name: Build Linux AppImages (agent + client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The image, Qt and both cargo targets need ~15 GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Ubuntu 22.04 + Qt 6.8 + FFmpeg/x264/SVT-AV1/dav1d/libva/oneVPL + slim ICU
      # data. The layers are cached, so only Lunaris itself is rebuilt on most runs.
      - name: Build packaging image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: scripts/packaging
          file: scripts/packaging/Containerfile.appimage
          tags: localhost/lunaris-appimage-build:22.04
          load: true
          cache-from: type=gha,scope=agent-appimage
          cache-to: type=gha,mode=max,scope=agent-appimage

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build-dir/cargo-cache
            build-dir/target-appimage
          key: agent-appimage-${{ hashFiles('Cargo.lock', 'scripts/packaging/Containerfile.appimage', 'scripts/packaging/build-ffmpeg-static.sh') }}
          restore-keys: agent-appimage-

      - name: Build AppImages
        run: CONTAINER=docker ./scripts/packaging/build-appimages.sh

      - name: Upload Agent AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-linux-appimage
          path: dist/Lunaris-Agent-*-x86_64.AppImage

      - name: Upload Client Desktop Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-desktop-linux
          path: dist/client-desktop-x86_64.AppImage

  build-ffmpeg-windows:
    name: Build FFmpeg for Windows (trimmed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache FFmpeg build
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-windows
          key: ffmpeg-windows-${{ hashFiles('scripts/packaging/windows/build-ffmpeg-mingw.sh') }}

      - name: Cross-compile with mingw-w64
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential mingw-w64 nasm meson ninja-build cmake
          bash scripts/packaging/windows/build-ffmpeg-mingw.sh ffmpeg-windows

      - name: Upload FFmpeg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-windows

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: build-ffmpeg-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache vcpkg installed packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: vcpkg-win-x64-opus-openssl-v3

      - name: Install C/C++ libraries via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          Add-Content -Path "C:\vcpkg\triplets\x64-windows.cmake" -Value "`nset(VCPKG_BUILD_TYPE release)"
          vcpkg install opus:x64-windows openssl:x64-windows
        shell: pwsh

      # Trimmed FFmpeg 8.1 cross-compiled by the build-ffmpeg-windows job
      # (only the codecs Lunaris uses; x264/SVT-AV1/dav1d inside the DLLs).
      - name: Download FFmpeg
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-windows
          path: C:\ffmpeg

      - name: Add FFmpeg to PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\ffmpeg\bin"
        shell: pwsh

      - name: Install pkg-config
        run: |
          choco install pkgconfiglite -y
        shell: pwsh

      - name: Install Qt6
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia qtshadertools'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-04-17

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Configure environment
        run: |
          echo "PKG_CONFIG_PATH=C:/vcpkg/installed/x64-windows/lib/pkgconfig" >> $GITHUB_ENV
          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV
          echo "FFMPEG_DIR=C:/ffmpeg" >> $GITHUB_ENV
          echo "QMAKE=${QT_ROOT_DIR}/bin/qmake.exe" >> $GITHUB_ENV
        shell: bash

      - name: Debug environment
        run: |
          echo "=== Qt ==="
          echo "QT_ROOT_DIR: $QT_ROOT_DIR"
          echo "QMAKE: $QMAKE"
          which qmake.exe || which qmake || echo "qmake not in PATH"
          ls "$QT_ROOT_DIR/bin/" | head -10 || echo "Cannot list QT_ROOT_DIR/bin"
          echo "=== pkg-config ==="
          which pkg-config || echo "pkg-config not found"
          pkg-config --list-all 2>/dev/null | grep -i opus || echo "opus.pc not found via pkg-config"
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          ls C:/vcpkg/installed/x64-windows/lib/pkgconfig/ || echo "Cannot list pkgconfig dir"
          echo "=== FFmpeg ==="
          ls C:/ffmpeg/lib | head -20
        shell: bash

      # For the server (server.exe embeds web/dist); the client and the agent
      # embed no web client.
      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build
        shell: pwsh

      - name: Build Rust Workspace
        run: cargo build --release --workspace
        shell: pwsh

      - name: Package Server
        run: |
          # The web client is embedded in the executable.
          New-Item -ItemType Directory -Force -Path lunaris-server
          Copy-Item target/release/server.exe -Destination lunaris-server/lunaris-server.exe
          Copy-Item LICENSE -Destination lunaris-server/
          Compress-Archive -Path lunaris-server/* -DestinationPath lunaris-server-windows-x86_64.zip

          # Installer: the LunarisServer Windows service, firewall rule and a
          # locked-down %ProgramData%\Lunaris (scripts/packaging/server-installer.nsi).
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          makensis /DVERSION=$version scripts/packaging/server-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
        shell: pwsh

      - name: Upload Server Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-windows
          path: lunaris-server-windows-x86_64.zip

      - name: Upload Server Installer Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-installer-windows
          path: lunaris-server-installer.exe

      - name: Package Client Desktop
        run: |
          New-Item -ItemType Directory -Force -Path lunaris-client-desktop
          Copy-Item target/release/client-desktop.exe -Destination lunaris-client-desktop/
          & "${env:QT_ROOT_DIR}/bin/windeployqt.exe" --qmldir client-qml/qml --no-translations --no-opengl-sw --no-compiler-runtime lunaris-client-desktop/client-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          # Drop what the app does not use (see the script), then add our FFmpeg.
          ./scripts/packaging/windows/prune-qt.ps1 -Dir lunaris-client-desktop
          Copy-Item "C:/ffmpeg/bin/*.dll" -Destination lunaris-client-desktop/
          Copy-Item LICENSE, scripts/packaging/THIRD-PARTY-NOTICES.md -Destination lunaris-client-desktop/
          # The client quits without a lunaris:// link: one it ignores keeps it up.
          ./scripts/packaging/windows/smoke-qml.ps1 -Exe lunaris-client-desktop/client-desktop.exe -ExeArgs 'lunaris://connect?smoke=1'
          Compress-Archive -Path lunaris-client-desktop/* -DestinationPath lunaris-client-desktop-windows.zip
          
          # Create Windows NSIS Installer
          makensis client-desktop-installer.nsi

        shell: pwsh

      - name: Package Agent
        run: |
          # Two self-contained folders that the installer puts in one install
          # folder (the agent only lets a helper from its own folder answer):
          #   lunaris-agent/            the command-line agent (the LunarisAgentService
          #                             service runs it; no Qt), FFmpeg, the MSVC runtime
          #   lunaris-approval-helper/  the optional tray (Qt + its QML modules)
          New-Item -ItemType Directory -Force -Path lunaris-agent, lunaris-approval-helper
          Copy-Item target/release/lunaris-agent.exe -Destination lunaris-agent/
          Copy-Item "$env:VCToolsRedistDir/x64/Microsoft.VC143.CRT/*.dll" -Destination lunaris-agent/
          Copy-Item "C:/ffmpeg/bin/*.dll" -Destination lunaris-agent/
          Copy-Item LICENSE, scripts/packaging/THIRD-PARTY-NOTICES.md -Destination lunaris-agent/

          Copy-Item target/release/lunaris-approval-helper.exe -Destination lunaris-approval-helper/
          & "${env:QT_ROOT_DIR}/bin/windeployqt.exe" --qmldir approval-helper/qml --no-translations --no-opengl-sw --no-compiler-runtime lunaris-approval-helper/lunaris-approval-helper.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          # Drop what the helper does not use (see the script; it adds the MSVC runtime).
          ./scripts/packaging/windows/prune-qt.ps1 -Dir lunaris-approval-helper
          Get-ChildItem lunaris-agent, lunaris-approval-helper | Select-Object -First 60 Name

          # Smoke tests with nothing but Windows on PATH and the build machine's
          # Qt hidden: a missing DLL makes the process die at load (0xC0000135).
          # The agent (from its folder alone: it needs no Qt) prints its help and
          # its status (no config yet); the helper exits at once here (no agent
          # service to answer for) after loading its DLLs.
          $clean = "C:\Windows\System32;C:\Windows"
          $p = Start-Process lunaris-agent/lunaris-agent.exe -ArgumentList "--help" -PassThru -Wait -NoNewWindow -Environment @{ PATH = $clean }
          if ($p.ExitCode -ne 0) { throw "lunaris-agent --help exited with $($p.ExitCode)" }
          $p = Start-Process lunaris-agent/lunaris-agent.exe -ArgumentList "--config", "$env:RUNNER_TEMP\smoke_config.json", "status" -PassThru -Wait -NoNewWindow -Environment @{ PATH = $clean }
          if ($p.ExitCode -ne 0) { throw "lunaris-agent status exited with $($p.ExitCode)" }
          $p = Start-Process lunaris-approval-helper/lunaris-approval-helper.exe -PassThru -Wait -Environment @{ PATH = $clean }
          if ($p.ExitCode -ne 0) { throw "lunaris-approval-helper exited with $($p.ExitCode)" }

          # The zip: both in one folder, as installed.
          New-Item -ItemType Directory -Force -Path lunaris-agent-zip
          Copy-Item -Recurse lunaris-agent/*, lunaris-approval-helper/* -Destination lunaris-agent-zip/ -Force
          Compress-Archive -Path lunaris-agent-zip/* -DestinationPath lunaris-agent-windows.zip

          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          makensis /DVERSION=$version scripts/packaging/agent-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
        shell: pwsh

      - name: Upload Client Desktop Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-desktop-windows
          path: lunaris-client-desktop-windows.zip

      - name: Upload Client Desktop Installer Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-desktop-installer-windows
          path: lunaris-client-installer.exe

      - name: Upload Agent Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-windows
          path: lunaris-agent-windows.zip

      - name: Upload Agent Installer Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-installer-windows
          path: lunaris-agent-installer.exe

  release:
    name: Create Release
    needs: [build-server-linux, build-server-docker, build-linux-packages, test-linux-packages, build-agent-appimage, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Signs and publishes: runs in the "release" environment, so the signing
    # key can be kept there as an environment secret, behind required
    # reviewers and a tag rule (Settings > Environments > release). GitHub
    # makes the environment, unprotected, on the first run that names it;
    # repository secrets keep working until the key is moved there.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Linux Server Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-linux
          path: ./artifacts/linux-server

      - name: Download Linux Server packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-linux-deb
          path: ./artifacts/linux-server-deb

      - name: Download Linux Client Desktop Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-desktop-linux
          path: ./artifacts/linux-client-desktop

      - name: Download Windows Server Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-windows
          path: ./artifacts/windows-server

      - name: Download Windows Server Installer Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-installer-windows
          path: ./artifacts/windows-server-installer

      - name: Download Windows Client Desktop Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-desktop-windows
          path: ./artifacts/windows-client-desktop

      - name: Download Linux distro packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linux-packages-*
          merge-multiple: true
          path: ./artifacts/linux-packages

      - name: Download Linux Agent AppImage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-linux-appimage
          path: ./artifacts/linux-agent

      - name: Download Windows Agent Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-windows
          path: ./artifacts/windows-agent

      - name: Download Windows Agent Installer Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-installer-windows
          path: ./artifacts/windows-agent-installer

      - name: Download Windows Client Desktop Installer Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-desktop-installer-windows
          path: ./artifacts/windows-client-desktop-installer



      - name: Organize Release Files
        run: |
          mkdir -p release-files

          # Linux
          mv ./artifacts/linux-server/lunaris-server-linux-*.tar.gz ./release-files/
          mv ./artifacts/linux-server-deb/lunaris-server_*.deb ./release-files/
          mv ./artifacts/linux-client-desktop/client-desktop-x86_64.AppImage ./release-files/lunaris-client-desktop-linux.AppImage
          mv ./artifacts/linux-packages/* ./release-files/
          mv ./artifacts/linux-agent/Lunaris-Agent-*-x86_64.AppImage ./release-files/lunaris-agent-linux-x86_64.AppImage

          # Windows
          mv ./artifacts/windows-server/lunaris-server-windows-x86_64.zip ./release-files/
          mv ./artifacts/windows-server-installer/lunaris-server-installer.exe ./release-files/lunaris-server-installer-windows.exe
          mv ./artifacts/windows-client-desktop/lunaris-client-desktop-windows.zip ./release-files/
          mv ./artifacts/windows-agent/lunaris-agent-windows.zip ./release-files/
          mv ./artifacts/windows-agent-installer/lunaris-agent-installer.exe ./release-files/lunaris-agent-installer-windows.exe
          mv ./artifacts/windows-client-desktop-installer/lunaris-client-installer.exe ./release-files/lunaris-client-installer-windows.exe

      # SHA256SUMS over every release file, and SHA256SUMS.sig: an Ed25519
      # signature over its exact bytes. The app and the agent install an
      # update only when both check out against the public key built into
      # them (updater/src/verify.rs, docs/release-signing.md). No release is
      # published unsigned: a missing secret or a key that does not match the
      # one in the source fails this step.
      - name: Checksums and signature
        env:
          LUNARIS_RELEASE_SIGNING_KEY: ${{ secrets.LUNARIS_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LUNARIS_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::The LUNARIS_RELEASE_SIGNING_KEY secret is not set: refusing to publish an unsigned release (docs/release-signing.md)."
            exit 1
          fi
          cd release-files
          rm -f SHA256SUMS SHA256SUMS.sig
          sums="$(mktemp)"
          # First line binds the signed list to this version (updater/src/verify.rs).
          printf '# lunaris %s\n' "${GITHUB_REF_NAME#v}" > "$sums"
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum -- >> "$sums"
          mv "$sums" SHA256SUMS
          chmod 644 SHA256SUMS
          cat SHA256SUMS

          umask 077
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$LUNARIS_RELEASE_SIGNING_KEY" > "$keydir/key.pem"
          chmod 600 "$keydir/key.pem"
          openssl pkeyutl -sign -rawin -inkey "$keydir/key.pem" -in SHA256SUMS -out SHA256SUMS.sig
          openssl pkey -in "$keydir/key.pem" -pubout -out "$keydir/pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$keydir/pub.pem" -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          public_key="$(openssl pkey -pubin -in "$keydir/pub.pem" -outform DER | tail -c 32 | base64)"
          rm -rf "$keydir"
          trap - EXIT

          test "$(stat -c %s SHA256SUMS.sig)" -eq 64
          # The key built into this release's app must be the signing key,
          # otherwise no copy could ever check its updates.
          embedded="$(sed -n 's/^pub const RELEASE_SIGNING_PUBLIC_KEY_B64: &str = "\(.*\)";$/\1/p' ../updater/src/verify.rs)"
          echo "Signing public key: $public_key"
          if [ "$embedded" != "$public_key" ]; then
            echo "::error::RELEASE_SIGNING_PUBLIC_KEY_B64 in updater/src/verify.rs ($embedded) is not the public key of LUNARIS_RELEASE_SIGNING_KEY ($public_key)."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          files: |
            release-files/lunaris-server-linux-x86_64.tar.gz
            release-files/lunaris-server-linux-aarch64.tar.gz
            release-files/lunaris-client-desktop-linux.AppImage
            release-files/lunaris-agent-linux-x86_64.AppImage
            release-files/*.deb
            release-files/*.rpm
            release-files/*.pkg.tar.zst
            release-files/lunaris-server-windows-x86_64.zip
            release-files/lunaris-server-installer-windows.exe
            release-files/lunaris-client-desktop-windows.zip
            release-files/lunaris-agent-windows.zip
            release-files/lunaris-agent-installer-windows.exe
            release-files/lunaris-client-installer-windows.exe
            release-files/SHA256SUMS
            release-files/SHA256SUMS.sig

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
