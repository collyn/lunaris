name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/packaging/**'
      - 'server/**'
      - 'Dockerfile'
      - 'agent/**'
      - 'client-qml/**'
      - 'client-desktop/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev libavahi-compat-libdnssd-dev \
            libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libopus-dev qt6-base-dev qt6-declarative-dev qt6-multimedia-dev libgl1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libavfilter-dev libavdevice-dev libpostproc-dev libpipewire-0.3-dev
          # QML modules the client imports; build-appimage.sh bundles them.
          sudo apt-get install -y qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-shapes qml6-module-qtqml-workerscript qml6-module-qt-labs-platform \
            qml6-module-qtmultimedia

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-17

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Web Frontend
        run: |
          cd web
          npm ci || npm install
          npm run build

      - name: Build Rust Workspace
        run: cargo build --release --workspace

      - name: Install packaging tools
        run: sudo apt-get install -y patchelf

      - name: Package Client Desktop and QML as AppImages
        run: |
          ./scripts/build-appimage.sh client-desktop
          ./scripts/build-appimage.sh client-qml

      - name: Upload Client Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-desktop-linux
          path: build-dir/client-desktop-x86_64.AppImage

      - name: Upload Client QML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-qml-linux
          path: build-dir/client-qml-x86_64.AppImage

  build-server-linux:
    name: Build Linux Server (static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # The server embeds web/dist, so build the web client first.
      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-17
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: server-musl

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # Fully static musl binaries: run on any Linux distro, x86_64 and ARM64.
      - name: Build and package
        run: |
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --locked -p server --target $arch-unknown-linux-musl
            dir=lunaris-server-linux-$arch
            mkdir -p $dir
            cp target/$arch-unknown-linux-musl/release/server $dir/lunaris-server
            cp LICENSE $dir/
            tar -czf $dir.tar.gz $dir
          done
          file lunaris-server-linux-*/lunaris-server

      - name: Upload Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: lunaris-server-linux-*.tar.gz

  build-server-docker:
    name: Build Server Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: lunaris-server:ci
          load: true
          cache-from: type=gha,scope=server-docker
          cache-to: type=gha,mode=max,scope=server-docker

      - name: Smoke test
        run: |
          docker run -d --name lunaris -p 8090:8090 lunaris-server:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/ | grep -q '<div id="root">'
          docker exec lunaris test -s /data/initial_admin_password.txt
          docker logs lunaris 2>&1 | tail -20

  build-linux-packages:
    name: Linux packages (${{ matrix.format }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # rpm (fedora:44) and arch are paused: the pipewire/libspa 0.8 crates
        # don't build with clang 21 (bindgen 0.69); needs the pipewire 0.9
        # upgrade in lunaris-media. The scripts support them already.
        include:
          - format: deb
            image: ubuntu:24.04
    steps:
      # actions/checkout needs git in the container to produce a real clone
      # (the Arch build uses `git archive`).
      - name: Install git
        run: |
          case "${{ matrix.format }}" in
            deb)  apt-get update && apt-get install -y git ca-certificates ;;
            rpm)  dnf -y install git ;;
            arch) pacman -Syu --noconfirm git ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache static FFmpeg
        if: matrix.format != 'arch'
        uses: actions/cache@v4
        with:
          path: /opt/lunaris-ffmpeg
          key: ffmpeg-static-${{ matrix.format }}-${{ hashFiles('scripts/packaging/build-ffmpeg-static.sh') }}

      - name: Build packages
        run: bash scripts/packaging/linux/build-packages.sh ${{ matrix.format }} dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.format }}
          path: dist/*

  build-agent-appimage:
    name: Build Linux Agent (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ubuntu 22.04 + Qt 6.8 + FFmpeg/x264/SVT-AV1/libva/oneVPL. The layers are
      # cached, so only the agent itself is rebuilt on most runs.
      - name: Build packaging image
        uses: docker/build-push-action@v6
        with:
          context: scripts/packaging
          file: scripts/packaging/Containerfile.appimage
          tags: localhost/lunaris-appimage-build:22.04
          load: true
          cache-from: type=gha,scope=agent-appimage
          cache-to: type=gha,mode=max,scope=agent-appimage

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            build-dir/cargo-cache
            build-dir/target-appimage
          key: agent-appimage-${{ hashFiles('Cargo.lock', 'scripts/packaging/Containerfile.appimage') }}
          restore-keys: agent-appimage-

      - name: Build AppImage
        run: CONTAINER=docker ./scripts/packaging/build-agent-appimage.sh

      - name: Upload Agent AppImage
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-appimage
          path: dist/Lunaris-Agent-*-x86_64.AppImage

  build-ffmpeg-windows:
    name: Build FFmpeg for Windows (trimmed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache FFmpeg build
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-windows
          key: ffmpeg-windows-${{ hashFiles('scripts/packaging/windows/build-ffmpeg-mingw.sh') }}

      - name: Cross-compile with mingw-w64
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential mingw-w64 nasm meson ninja-build cmake
          bash scripts/packaging/windows/build-ffmpeg-mingw.sh ffmpeg-windows

      - name: Upload FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-windows

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: build-ffmpeg-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: vcpkg-win-x64-opus-openssl-v3

      - name: Install C/C++ libraries via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          Add-Content -Path "C:\vcpkg\triplets\x64-windows.cmake" -Value "`nset(VCPKG_BUILD_TYPE release)"
          vcpkg install opus:x64-windows openssl:x64-windows
        shell: pwsh

      # Trimmed FFmpeg 8.1 cross-compiled by the build-ffmpeg-windows job
      # (only the codecs Lunaris uses; x264/SVT-AV1/dav1d inside the DLLs).
      - name: Download FFmpeg
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: C:\ffmpeg

      - name: Add FFmpeg to PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\ffmpeg\bin"
        shell: pwsh

      - name: Install pkg-config
        run: |
          choco install pkgconfiglite -y
        shell: pwsh

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia qtshadertools'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-17

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Configure environment
        run: |
          echo "PKG_CONFIG_PATH=C:/vcpkg/installed/x64-windows/lib/pkgconfig" >> $GITHUB_ENV
          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV
          echo "FFMPEG_DIR=C:/ffmpeg" >> $GITHUB_ENV
          echo "QMAKE=${QT_ROOT_DIR}/bin/qmake.exe" >> $GITHUB_ENV
        shell: bash

      - name: Debug environment
        run: |
          echo "=== Qt ==="
          echo "QT_ROOT_DIR: $QT_ROOT_DIR"
          echo "QMAKE: $QMAKE"
          which qmake.exe || which qmake || echo "qmake not in PATH"
          ls "$QT_ROOT_DIR/bin/" | head -10 || echo "Cannot list QT_ROOT_DIR/bin"
          echo "=== pkg-config ==="
          which pkg-config || echo "pkg-config not found"
          pkg-config --list-all 2>/dev/null | grep -i opus || echo "opus.pc not found via pkg-config"
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          ls C:/vcpkg/installed/x64-windows/lib/pkgconfig/ || echo "Cannot list pkgconfig dir"
          echo "=== FFmpeg ==="
          ls C:/ffmpeg/lib | head -20
        shell: bash

      - name: Build Web Frontend
        run: |
          cd web
          npm ci || npm install
          npm run build
        shell: pwsh

      - name: Build Rust Workspace
        run: cargo build --release --workspace
        shell: pwsh

      - name: Package Server
        run: |
          # The web client is embedded in the executable.
          New-Item -ItemType Directory -Force -Path lunaris-server
          Copy-Item target/release/server.exe -Destination lunaris-server/lunaris-server.exe
          Copy-Item LICENSE -Destination lunaris-server/
          Compress-Archive -Path lunaris-server/* -DestinationPath lunaris-server-windows-x86_64.zip
        shell: pwsh

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-windows
          path: lunaris-server-windows-x86_64.zip

      - name: Package Client Desktop
        run: |
          New-Item -ItemType Directory -Force -Path lunaris-client-desktop
          Copy-Item target/release/client-desktop.exe -Destination lunaris-client-desktop/
          & "${env:QT_ROOT_DIR}/bin/windeployqt.exe" --qmldir client-qml/qml --no-translations --compiler-runtime lunaris-client-desktop/client-desktop.exe
          Copy-Item "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination lunaris-client-desktop/
          Copy-Item "C:/ffmpeg/bin/*.dll" -Destination lunaris-client-desktop/
          Copy-Item LICENSE, scripts/packaging/THIRD-PARTY-NOTICES.md -Destination lunaris-client-desktop/
          Compress-Archive -Path lunaris-client-desktop/* -DestinationPath lunaris-client-desktop-windows.zip
          
          # Package QML Client separately (rename binary and bundle as client-qml)
          Copy-Item -Recurse lunaris-client-desktop -Destination lunaris-client-qml
          Rename-Item lunaris-client-qml/client-desktop.exe -NewName client-qml.exe
          Compress-Archive -Path lunaris-client-qml/* -DestinationPath lunaris-client-qml-windows.zip
          
          # Create Windows NSIS Installer
          makensis client-desktop-installer.nsi

        shell: pwsh

      - name: Package Agent
        run: |
          # Self-contained folder: Qt (+ QML modules), FFmpeg, opus/openssl and
          # the MSVC runtime, so it runs on a clean Windows install.
          New-Item -ItemType Directory -Force -Path lunaris-agent
          Copy-Item target/release/agent.exe -Destination lunaris-agent/lunaris-agent.exe
          & "${env:QT_ROOT_DIR}/bin/windeployqt.exe" --qmldir agent/qml --no-translations --no-opengl-sw --compiler-runtime lunaris-agent/lunaris-agent.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          Copy-Item "C:/vcpkg/installed/x64-windows/bin/*.dll" -Destination lunaris-agent/
          Copy-Item "C:/ffmpeg/bin/*.dll" -Destination lunaris-agent/
          Copy-Item "$env:VCToolsRedistDir/x64/Microsoft.VC143.CRT/*.dll" -Destination lunaris-agent/
          Remove-Item lunaris-agent/vc_redist*.exe -ErrorAction SilentlyContinue
          Copy-Item LICENSE, scripts/packaging/THIRD-PARTY-NOTICES.md -Destination lunaris-agent/
          Get-ChildItem lunaris-agent | Select-Object -First 40 Name

          # Smoke test with nothing but System32 on PATH: a missing DLL makes the
          # process die at load (0xC0000135); a broken QML import makes it exit early.
          # Also hide the build machine's Qt (QML/plugin search paths), so only
          # what was packaged can be found.
          $clean = "C:\Windows\System32;C:\Windows"
          $env:QML2_IMPORT_PATH = $null; $env:QML_IMPORT_PATH = $null; $env:QT_PLUGIN_PATH = $null
          $env:QT_ROOT_DIR = $null; $env:Qt6_DIR = $null
          $p = Start-Process lunaris-agent/lunaris-agent.exe -ArgumentList "--help" -PassThru -Wait -Environment @{ PATH = $clean }
          if ($p.ExitCode -ne 0) { throw "lunaris-agent --help exited with $($p.ExitCode)" }
          $gui = Start-Process lunaris-agent/lunaris-agent.exe -ArgumentList "--minimized" -PassThru -Environment @{ PATH = $clean; QT_QPA_PLATFORM = "offscreen"; QT_DEBUG_PLUGINS = "0" }
          Start-Sleep -Seconds 10
          if ($gui.HasExited) { throw "agent GUI exited early with code $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id -Force
          Remove-Item "$env:APPDATA/lunaris-agent" -Recurse -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path lunaris-agent/* -DestinationPath lunaris-agent-windows.zip

          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          makensis /DVERSION=$version scripts/packaging/agent-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
        shell: pwsh

      - name: Upload Client Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-desktop-windows
          path: lunaris-client-desktop-windows.zip

      - name: Upload Client QML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-qml-windows
          path: lunaris-client-qml-windows.zip

      - name: Upload Client Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-desktop-installer-windows
          path: lunaris-client-installer.exe

      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: lunaris-agent-windows.zip

      - name: Upload Agent Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-installer-windows
          path: lunaris-agent-installer.exe

  release:
    name: Create Release
    needs: [build-linux, build-server-linux, build-server-docker, build-linux-packages, build-agent-appimage, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Server Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-linux
          path: ./artifacts/linux-server

      - name: Download Linux Client Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-desktop-linux
          path: ./artifacts/linux-client-desktop

      - name: Download Linux Client QML Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-qml-linux
          path: ./artifacts/linux-client-qml

      - name: Download Windows Server Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-windows
          path: ./artifacts/windows-server

      - name: Download Windows Client Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-desktop-windows
          path: ./artifacts/windows-client-desktop

      - name: Download Windows Client QML Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-qml-windows
          path: ./artifacts/windows-client-qml



      - name: Download Linux distro packages
        uses: actions/download-artifact@v4
        with:
          pattern: linux-packages-*
          merge-multiple: true
          path: ./artifacts/linux-packages

      - name: Download Linux Agent AppImage
        uses: actions/download-artifact@v4
        with:
          name: agent-linux-appimage
          path: ./artifacts/linux-agent

      - name: Download Windows Agent Artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-windows
          path: ./artifacts/windows-agent

      - name: Download Windows Agent Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-installer-windows
          path: ./artifacts/windows-agent-installer

      - name: Download Windows Client Desktop Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-desktop-installer-windows
          path: ./artifacts/windows-client-desktop-installer



      - name: Organize Release Files
        run: |
          mkdir -p release-files

          # Linux
          mv ./artifacts/linux-server/lunaris-server-linux-*.tar.gz ./release-files/
          mv ./artifacts/linux-client-desktop/client-desktop-x86_64.AppImage ./release-files/lunaris-client-desktop-linux.AppImage
          mv ./artifacts/linux-client-qml/client-qml-x86_64.AppImage ./release-files/lunaris-client-qml-linux.AppImage
          mv ./artifacts/linux-packages/* ./release-files/
          mv ./artifacts/linux-agent/Lunaris-Agent-*-x86_64.AppImage ./release-files/lunaris-agent-linux-x86_64.AppImage

          # Windows
          mv ./artifacts/windows-server/lunaris-server-windows-x86_64.zip ./release-files/
          mv ./artifacts/windows-client-desktop/lunaris-client-desktop-windows.zip ./release-files/
          mv ./artifacts/windows-client-qml/lunaris-client-qml-windows.zip ./release-files/
          mv ./artifacts/windows-agent/lunaris-agent-windows.zip ./release-files/
          mv ./artifacts/windows-agent-installer/lunaris-agent-installer.exe ./release-files/lunaris-agent-installer-windows.exe
          mv ./artifacts/windows-client-desktop-installer/lunaris-client-installer.exe ./release-files/lunaris-client-installer-windows.exe



      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          files: |
            release-files/lunaris-server-linux-x86_64.tar.gz
            release-files/lunaris-server-linux-aarch64.tar.gz
            release-files/lunaris-client-desktop-linux.AppImage
            release-files/lunaris-client-qml-linux.AppImage
            release-files/lunaris-agent-linux-x86_64.AppImage
            release-files/*.deb
            release-files/*.rpm
            release-files/*.pkg.tar.zst
            release-files/lunaris-server-windows-x86_64.zip
            release-files/lunaris-client-desktop-windows.zip
            release-files/lunaris-client-qml-windows.zip
            release-files/lunaris-agent-windows.zip
            release-files/lunaris-agent-installer-windows.exe
            release-files/lunaris-client-installer-windows.exe

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
