[package]
name = "agent-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The standalone Lunaris agent: the agent library with its desktop window"

[[bin]]
name = "agent"
path = "src/main.rs"

[features]
default = ["gui"]
# The Qt window; without it the binary is the command-line agent only.
gui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib"]
# Link FFmpeg statically (distro packages, see scripts/packaging/build-ffmpeg-static.sh).
static-ffmpeg = ["agent/static-ffmpeg"]

[dependencies]
agent = { path = "../agent" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.18"
uuid = { version = "1.0", features = ["v4"] }
hostname = "0.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
urlencoding = "2.1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "charset", "http2", "system-proxy", "json", "blocking", "stream"] }
cxx = { version = "1.0", optional = true }
cxx-qt = { version = "0.6", optional = true }
cxx-qt-lib = { version = "0.6", features = ["qt_gui", "qt_qml"], optional = true }

[build-dependencies]
cxx-qt-build = "0.6"
