[workspace]
members = [
    "server",
    "agent",
    "agent-app",
    "common",
    "client-desktop",
    "client-qml",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }


