[package]
name = "approval-channel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The local channel between the Lunaris agent (daemon) and the optional approval helper tray: no GUI, no media"

[dependencies]
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
