[package]
name = "updater"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-app updates of the Lunaris app and agent: release check, signature check, install, restart"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1"
base64 = "0.23"
# Ed25519 signature of SHA256SUMS and the SHA-256 of the downloads (the
# version the workspace already uses).
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
