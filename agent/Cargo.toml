[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Link FFmpeg statically (distro packages, see scripts/packaging/build-ffmpeg-static.sh).
static-ffmpeg = ["dep:ffmpeg-sys-next", "ffmpeg-sys-next/static"]

[dependencies]
common = { path = "../common" }
lunaris-media = { git = "https://github.com/collyn/lunaris-media.git" }
ffmpeg-sys-next = { version = "8.1", optional = true, default-features = false }
bitflags = "2"

tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls", "rustls-tls-native-roots"] }
native-tls = "0.2"
webrtc = "0.21.1"
rtc = "0.21.1"
async-trait = "0.1"
webrtc-util = "0.17.1"
wtransport = { version = "0.7.1", features = ["self-signed"] }
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
anyhow = "1.0"
once_cell = "1.18"
thiserror = "2"
bytes = "1.0"
futures-util = "0.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
num-derive = "0.5"
num-traits = "0.2"
hostname = "0.4"
urlencoding = "2.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "stream"] }
zip = "0.6"
dirs = "5.0"
# Clipboard sharing (X11, Wayland data-control, Windows, macOS).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Virtual game controllers (uinput), same crate as lunaris-media.
evdev = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
# Virtual game controllers through the ViGEmBus driver.
vigem-client = "0.1.4"
# win_service.rs: the service that runs the host as SYSTEM in the console
# session (raw Win32 for the service itself, `windows-service` for install).
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }



