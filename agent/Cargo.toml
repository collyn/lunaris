[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Lunaris agent: the library and the lunaris-agent command-line program (daemon, no GUI)"

# The shipped program (Linux packages, Windows service and installer).
[[bin]]
name = "lunaris-agent"
path = "src/main.rs"

[features]
# Link FFmpeg statically (distro packages, see scripts/packaging/build-ffmpeg-static.sh).
static-ffmpeg = ["dep:ffmpeg-sys-next", "ffmpeg-sys-next/static"]

[dependencies]
# The approval helper's local channel (approval.rs).
approval-channel = { path = "../approval-channel" }
common = { path = "../common" }
# restart.rs: the headless agent re-executes itself when its program file is
# replaced by an update (updater::restart::watch_executable).
updater = { path = "../updater" }
lunaris-media = { git = "https://github.com/collyn/lunaris-media.git" }
ffmpeg-sys-next = { version = "8.1", optional = true, default-features = false }
bitflags = "2"

tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls", "rustls-tls-native-roots"] }
native-tls = "0.2"
# Server connection: our own TLS handshake, to pin a self-signed server
# certificate on first use (lib.rs `server_tls`). Same versions and the ring
# backend that tokio-tungstenite and wtransport already use.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-native-certs = "0.8"
# SHA-256 of the server certificate, OS random source for passwords and keys.
ring = "0.17"
# direct.rs: the self-signed certificate of the direct-connection listener
# (already used by wtransport and webrtc, ring backend).
rcgen = "0.14"
webrtc = "0.21.1"
rtc = "0.21.1"
async-trait = "0.1"
webrtc-util = "0.17.1"
wtransport = { version = "0.7.1", features = ["self-signed"] }
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
anyhow = "1.0"
once_cell = "1.18"
thiserror = "2"
bytes = "1.0"
futures-util = "0.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
num-derive = "0.5"
num-traits = "0.2"
hostname = "0.4"
urlencoding = "2.1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "charset", "http2", "system-proxy", "json", "blocking", "stream"] }
dirs = "7"
# Clipboard sharing (X11, Wayland data-control, Windows, macOS).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
libc = "0.2"
# rustdesk.rs: RustDesk's wire messages (types generated by build.rs from
# proto/rustdesk/message.proto).
prost = "0.14"
# rustdesk/session.rs: RustDesk's own expressions for "the peer is an address".
regex = "1"
# rustdesk/session.rs: the send buffer of a session's socket (already a
# dependency of tokio).
socket2 = "0.6"
# rustdesk/cursor.rs, rustdesk/clipboard.rs: RustDesk compresses cursor
# pixels and clipboard text with zstd (hbb_common/src/compress.rs) and names
# cursor shapes by an xxh3 hash (rustdesk/src/common.rs cursor_content_id).
zstd = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# connector/sunshine (GameStream client):
# RSA-2048 key generation for the client identity (ring cannot generate RSA
# keys); signing and verifying stay with ring.
# Pinned to the release candidate that sspi (connector/rdp, through
# ironrdp-connector) pins with `=`: Cargo keeps one 0.10 per build, and 0.10.0
# final cannot be beside it. Same key generation (rsa 0.10.0 only renamed
# `RsaPrivateKey` to `PrivateKey`).
rsa = "=0.10.0-rc.18"
# AES-128 single blocks for the pairing challenge (ECB without padding; ring
# has no raw block interface), AES-128-GCM of video packets, the control
# stream and RTSP, AES-128-CBC of audio packets.
aes = "0.9.4"
aes-gcm = "0.11.1"
cbc = "0.2.1"
# ENet, the transport of the GameStream control stream (pure Rust port of
# ENet 1.3.18; Sunshine uses a fork with the same wire format).
rusty_enet = "0.4.1"
# connector/rdp: IronRDP (Devolutions, MIT OR Apache-2.0), the client side of
# RDP: connection sequence with CredSSP/NLA (sspi, through ironrdp-connector),
# the active session (bitmap codecs, pointer), the clipboard channel, input
# state, the tokio framing; ironrdp-displaycontrol only for its size rule.
# One generation of crates (ironrdp-pdu 0.11).
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-pdu = "0.11"
ironrdp-core = "0.3"
ironrdp-graphics = "0.11"
ironrdp-tokio = "0.12"
ironrdp-cliprdr = "0.9"
ironrdp-displaycontrol = "0.10"
ironrdp-input = "0.9"
# The graphics pipeline (MS-RDPEGFX) over a dynamic virtual channel: whole
# frames (StartFrame..EndFrame) instead of bitmap rows painted top to bottom.
# ironrdp-session 0.13 composites its frames itself once it is registered.
ironrdp-dvc = "0.10"
ironrdp-egfx = "0.5"
# connector/rdp/tls.rs: the server certificate's public key for CredSSP
# (the same parser ironrdp-tls uses for `extract_tls_server_public_key`).
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
# connector/vnc: VNC Authentication (RFC 6143 7.2.2) is DES; ZRLE is zlib.
des = "0.9"
flate2 = "1"

[dev-dependencies]
# connector/rdp/fake_server.rs: IronRDP's server side of the connection
# sequence, for the RDP connector's tests (same generation as the client).
ironrdp-acceptor = "0.12"
ironrdp-svc = "0.10"

[build-dependencies]
# build.rs: message.proto -> Rust; protox is a protobuf compiler in pure Rust,
# so the build machines need no `protoc`.
prost-build = "0.14"
protox = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# Virtual game controllers (uinput), same crate as lunaris-media.
evdev = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
# Virtual game controllers through the ViGEmBus driver.
vigem-client = "0.1.4"
# win_service.rs: the service that runs the host as SYSTEM in the console
# session (raw Win32 for the service itself, `windows-service` for install).
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    # rustdesk/input.rs: LockWorkStation.
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }



