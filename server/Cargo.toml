[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
common = { path = "../common" }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header"] }
# HTTPS for the web client (tls.rs).
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.14"
hostname = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
# 10+ needs a crypto backend; rust_crypto is pure Rust (no C toolchain, NASM or cmake on Windows).
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
bcrypt = "0.19"
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
once_cell = "1.18"
chrono = { version = "0.4", features = ["serde"] }

webrtc = "0.21.1"
rtc = "0.21.1"
async-trait = "0.1"
turn = "0.17.1"
webrtc-util = "0.17.1"
wtransport = { version = "0.7.1", features = ["self-signed"] }
anyhow = "1.0"
thiserror = "2"
bytes = "1.0"
num-derive = "0.5"
num-traits = "0.2"
# The web UI (web/dist) is embedded so the server ships as a single file.
rust-embed = { version = "8", features = ["mime-guess"] }
# links.rs: connecting to agents added by address
tokio-tungstenite = "0.30"
urlencoding = "2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"


