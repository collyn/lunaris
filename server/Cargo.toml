[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
common = { path = "../common" }
# update_notice.rs: "a new version exists" in the log (release parsing and
# version comparison only; no downloads) over tokio-rustls below, with the
# system's CA certificates.
updater = { path = "../updater" }
rustls-native-certs = "0.8"
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header"] }
# HTTPS for the web client (tls.rs).
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.14"
hostname = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
# 10+ needs a crypto backend; rust_crypto is pure Rust (no C toolchain, NASM or cmake on Windows).
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
bcrypt = "0.19"
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
once_cell = "1.18"
chrono = { version = "0.4", features = ["serde"] }

webrtc = "0.21.1"
rtc = "0.21.1"
async-trait = "0.1"
turn = "0.17.1"
webrtc-util = "0.17.1"
wtransport = { version = "0.7.1", features = ["self-signed"] }
anyhow = "1.0"
thiserror = "2"
bytes = "1.0"
num-derive = "0.5"
num-traits = "0.2"
# The web UI (web/dist) is embedded so the server ships as a single file.
rust-embed = { version = "8", features = ["mime-guess"] }
# links.rs: connecting to agents added by address
tokio-tungstenite = "0.30"
urlencoding = "2.1"
# links.rs: the password proof (HMAC-SHA256) and nonces of the direct-connection
# handshake, same backend as tokio-rustls above.
ring = "0.17"
# links.rs: the v2 password check of that handshake (SPAKE2 over Ed25519, the
# same as agent/src/direct/handshake.rs); rand_core hands it ring's OS random.
spake2 = { version = "0.5.0-pre.0", default-features = false }
rand_core = { version = "0.10", default-features = false }
# Secrets (JWT key, agent token) from the OS random source; agent keys stored
# as SHA-256; tokens and keys compared in constant time.
getrandom = "0.4"
sha2 = "0.11"
hex = "0.4"
# backup.rs: a backup is one .tar.gz file.
tar = { version = "0.4", default-features = false }
flate2 = "1"
subtle = "2.6"
# Two-factor sign-in (mfa.rs): RFC 6238 codes and otpauth:// links for
# authenticator apps; the secret comes from getrandom above. The QR code is
# drawn as SVG (no image crates).
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth"] }
qrcodegen = "1.8.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# win_acl.rs: the data folder and secret files for SYSTEM and Administrators
# only (the same crate and version as the agent).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }


