[package]
name = "client-qml"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "client_qml"
path = "src/lib.rs"

# The program (lunaris-client in the packages; the file keeps the name the
# packages, installers and in-app updates know).
[[bin]]
name = "client-desktop"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
# The direct connection to an agent (agent::direct) and the key positions
# of the scan codes sent (agent::connector::sunshine::keymap).
agent = { path = "../agent" }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls", "rustls-tls-native-roots"] }
webrtc = "0.21.1"
rtc = "0.21.1"
async-trait = "0.1"
wtransport = { version = "0.7.1", features = ["dangerous-configuration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
cpal = "0.18"
ffmpeg-next = "8.0"
url = "2.5"
opus = "0.4"
bytes = "1.0"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "charset", "http2", "system-proxy", "json"] }
hostname = "0.4"
dirs = "7"
# Clipboard sharing with the remote computer.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
png = "0.18"
# Game controllers of this computer, sent to the remote one.
gilrs = "0.11"
# The single-instance channel's key proof (HMAC) and random nonces; the
# version the workspace already uses.
ring = "0.17"


# Qt6 bindings dependencies
cxx = "1.0"
cxx-qt = "0.6"
cxx-qt-lib = { version = "0.6", features = ["qt_gui", "qt_qml"] }

[target.'cfg(unix)'.dependencies]
# Also the single-instance socket's peer check (SO_PEERCRED / getpeereid).
libc = "0.2"

[build-dependencies]
cxx-qt-build = "0.6"
# The icon and the manifest of the Windows program (build.rs).
winresource = "0.1"

[features]
# Link FFmpeg statically (distro packages, see scripts/packaging/build-ffmpeg-static.sh).
static-ffmpeg = ["ffmpeg-next/static"]
